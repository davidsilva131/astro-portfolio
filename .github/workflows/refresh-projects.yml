name: Refresh Projects Section

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK_URL: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::Secret CLOUDFLARE_PAGES_DEPLOY_HOOK_URL is not set. Create a deploy hook in Cloudflare Pages (Settings > Deploy hooks) and add it with: gh secret set CLOUDFLARE_PAGES_DEPLOY_HOOK_URL"
            exit 1
          fi
          curl -sf -X POST "$HOOK_URL"
